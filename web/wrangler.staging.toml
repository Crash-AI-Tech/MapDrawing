# Isolated Cloudflare test environment. Resource identifiers are public config;
# AUTH_SECRET and RESEND_API_KEY remain Cloudflare Secrets and are never committed.
name = "map-staging"
account_id = "97c791889a9678820bdb511581c1635b"
main = ".open-next/worker.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "map-staging"

# Clean v2 test database. The previous map-db-staging database is only the
# migration source and can be deleted after the deployed environment is verified.
[[d1_databases]]
binding = "DB"
database_name = "map-db-staging-v2"
database_id = "b6d8b429-8e17-43db-afb1-48b3b35f3bab"
migrations_dir = "../drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "map-storage-staging"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "map-next-cache-staging"

[[kv_namespaces]]
binding = "CACHE"
id = "a411247c9b69487e8ebcc978cf02e9aa"

[vars]
APPLE_CLIENT_ID = "com.niubi.agent"
ENABLE_PRESENCE = "false"
NEXT_PUBLIC_ENABLE_PRESENCE = "false"
APP_ENV = "staging"

# AUTH_SECRET, RESEND_API_KEY, APPLE_TEAM_ID, APPLE_KEY_ID and
# APPLE_PRIVATE_KEY must be configured as secrets for this Worker.

[observability]
enabled = true
