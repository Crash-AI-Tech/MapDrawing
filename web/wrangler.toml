# Cloudflare Workers 配置 (@opennextjs/cloudflare v1.x)
name = "map"
account_id = "97c791889a9678820bdb511581c1635b"
main = ".open-next/worker.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 静态资源 (由 Worker 提供服务)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 自引用 service binding (opennextjs-cloudflare 所需，名称须与 worker name 一致)
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "map"

# D1 v2 production database. The original map-db remains untouched as the
# rollback source after the user/session-only migration.
[[d1_databases]]
binding = "DB"
database_name = "map-db-v2"
database_id = "2caf30c5-cc2a-4e74-9153-a869ac6b590c"
migrations_dir = "../drizzle/migrations"

# R2 对象存储 (用户上传)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "map-storage"

# R2 增量缓存 (Next.js ISR/SSG 缓存, open-next.config.ts 中配置了 r2IncrementalCache)
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "map-next-cache"

# KV 边缘缓存
[[kv_namespaces]]
binding = "CACHE"
id = "e2837190f44c4e2f854c39b95cea2e51"

# 环境变量
# AUTH_SECRET, RESEND_API_KEY, APPLE_TEAM_ID, APPLE_KEY_ID and
# APPLE_PRIVATE_KEY are Cloudflare Secrets (wrangler secret put).
# 本地开发使用 .dev.vars 文件
[vars]
APPLE_CLIENT_ID = "com.niubi.agent"
ENABLE_PRESENCE = "false"
NEXT_PUBLIC_ENABLE_PRESENCE = "false"

[observability]
enabled = true
